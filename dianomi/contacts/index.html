<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Рецензент.рус</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/media.css">
</head>
<body>

  <!-- Header -->
  <div id="header-root"></div>

  <main>

    <section class="page-header">
      <div class="page-header__container">
        <h1 class="page-header__title">Контакты</h1>
      </div>
    </section>

    <section class="contacts-info">
      <div class="contacts-info__container">
        <div class="contacts-info__item">
          <h3>Телефон</h3>
          <p>+7 (XXX) XXX-XX-XX</p>
        </div>
        <div class="contacts-info__item">
          <h3>Email</h3>
          <p>info@рецензент.рус</p>
        </div>
        <div class="contacts-info__item">
          <h3>Адрес</h3>
          <p>г. Москва, ул. Примерная, д. 1</p>
        </div>
      </div>
    </section>

    <section class="request-form" id="form">
      <div class="request-form__container">
        <h2 class="section-title">Оставить заявку</h2>
        <form class="form" action="#" method="POST">
          <input type="text" class="form__input" name="name" placeholder="Ваше имя" required>
          <input type="tel" class="form__input" name="phone" placeholder="Телефон" required>
          <textarea class="form__textarea" name="message" placeholder="Опишите вашу ситуацию..." rows="4"></textarea>
          <label class="form__label"><input type="checkbox" name="agree" required><span>Я согласен на обработку персональных данных</span></label>
          <button type="submit" class="form__submit">Отправить заявку</button>
        </form>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <div id="footer-root"></div>

  <script src="../js/components-loader.js"></script>
  <script src="../js/script.js"></script>
</body>
</html>
