<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="canonical" href="https://objektiv-expert.ru/kontakty/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — Объектив-Эксперт</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к содержимому</a>
  <div id="header-container"></div>
  <main id="main-content">
    <section class="section">
      <div class="container">
        <h1 class="section__title">Контакты</h1>
        <div class="contacts-grid">
          <div class="contact-info">
            <p class="contact-info__address">656049 г. Барнаул, пер. Прудской 69А, оф. 67</p>
            <p class="contact-info__phone">Телефон: <a href="tel:+79059830969">+7 (905) 983-09-69</a></p>
            <p class="contact-info__email">Email: <a href="mailto:info@objektiv-expert.ru">info@objektiv-expert.ru</a></p>
            <p class="contact-info__bot"><a href="https://max.ru/id222263914729_bot" target="_blank" rel="noopener">Бот в Max.ru</a></p>
            <p class="contact-info__hours">Пн–Пт: 9:00–17:00</p>
          </div>
          <div class="contact-form-wrap">
            <form class="form" action="#" method="POST">
              <h3 class="form__title">Пришлите документ + телефон</h3>
              <input type="text" class="form__input" name="name" placeholder="Ваше имя" required>
              <input type="tel" class="form__input" name="phone" placeholder="Телефон" required>
              <input type="text" class="form__input" name="document" placeholder="Ссылка на документ или описание">
              <textarea class="form__textarea" name="question" placeholder="Ваш вопрос" rows="4"></textarea>
              <label class="form__label"><input type="checkbox" name="agree" required><span>Я согласен на обработку персональных данных</span></label>
              <button type="submit" class="form__submit">Отправить</button>
            </form>
            <p class="form__note">Пришлите документ + телефон — бесплатно оценим материалы</p>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer-container"></div>
  <script src="assets/js/modules/components.js" defer></script>
</body>
</html>
