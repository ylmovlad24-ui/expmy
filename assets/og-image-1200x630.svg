<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23152"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#e94560" opacity="0.03"/>
  <circle cx="1100" cy="500" r="150" fill="#e94560" opacity="0.02"/>
  
  <!-- Left accent line -->
  <rect x="80" y="120" width="4" height="400" fill="url(#line)" rx="2"/>
  
  <!-- Logo area -->
  <text x="120" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#e94560" letter-spacing="2">ОЭ</text>
  
  <!-- Main title -->
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="1">Центр независимых</text>
  <text x="120" y="260" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="1">экспертиз</text>
  
  <!-- Accent text -->
  <text x="120" y="330" font-family="Arial, sans-serif" font-size="24" fill="#e94560" font-weight="bold">«Объектив-Эксперт»</text>
  
  <!-- Subtitle -->
  <text x="120" y="390" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">Автотехническая и автотовароведческая экспертиза</text>
  <text x="120" y="420" font-family="Arial, sans-serif" font-size="20" fill="#a0a0b0">Судебная и внесудебная. Рецензирование по ФЗ-73</text>
  
  <!-- Stats -->
  <rect x="120" y="460" width="1" height="40" fill="#e94560"/>
  <text x="145" y="485" font-family="Arial, sans-serif" font-size="16" fill="#a0a0b0">С 2016 года</text>
  <text x="280" y="485" font-family="Arial, sans-serif" font-size="16" fill="#a0a0b0">Барнаул</text>
  <text x="400" y="485" font-family="Arial, sans-serif" font-size="16" fill="#a0a0b0">Реестр Минюста</text>
  
  <!-- Right side decorative element -->
  <g transform="translate(900, 200)" opacity="0.15">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#e94560" stroke-width="2"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#e94560" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="40" fill="none" stroke="#e94560" stroke-width="1"/>
    <circle cx="100" cy="100" r="20" fill="#e94560" opacity="0.3"/>
  </g>
  
  <!-- Bottom bar -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accent)"/>
</svg>
